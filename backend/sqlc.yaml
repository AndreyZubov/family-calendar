# sqlc: generates type-safe Go code from SQL. Run `make generate`.
# Docs: https://docs.sqlc.dev/en/stable/reference/config.html
version: "2"
sql:
  - engine: postgresql
    # sqlc understands goose annotations and only reads the "Up" sections.
    schema: migrations
    queries: queries
    strict_function_checks: true
    gen:
      go:
        package: db
        out: internal/store/db
        sql_package: pgx/v5
        emit_interface: true          # Querier interface, handy for fakes in tests
        emit_empty_slices: true       # :many returns [] instead of nil (JSON-friendly)
        emit_pointers_for_null_types: true # nullable text -> *string
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
