# Continuous integration: every push to main and every pull request.
#
# Jobs run in parallel:
#   backend   lint, vet, tests (Postgres via testcontainers), generated code, vulnerabilities
#   frontend  lint, types, format, unit tests, generated API types, build, npm audit
#   e2e       Playwright in Chromium against the production build (binary with embedded UI)
#   docker    build the image, smoke-test it alone and as the production Compose stack
#   workflows actionlint
#
# Security: read-only token, no secrets used, actions pinned to commit SHAs
# (a tag can be moved to malicious code; a SHA cannot). Dependabot updates them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same PR cancels the previous run.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0
  SQLC_VERSION: v1.31.1

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: backend

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Generated sqlc code is up to date
        run: go run "github.com/sqlc-dev/sqlc/cmd/sqlc@${SQLC_VERSION}" diff

      - name: Tests (race detector, coverage)
        # DB tests start postgres:17.11-alpine with testcontainers (Docker is
        # available on GitHub-hosted runners).
        run: go test -race -count=1 -coverpkg=./internal/... -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (exactly as locked, no install scripts)
        run: npm ci --no-audit --no-fund

      - name: Generated API types match the OpenAPI spec
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/schema.ts

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npx vitest --run
      - run: npm run build

      - name: npm audit (high and critical)
        run: npm audit --audit-level=high

  e2e:
    name: End-to-end (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Browser tests against the binary with the embedded production build
        # Starts Postgres (Compose), the dev OIDC provider, and the server;
        # fails on any browser console error, including CSP violations.
        run: make e2e-binary
        env:
          CI: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true # into the local Docker for the smoke tests; nothing is pushed
          tags: family-calendar:ci
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image smoke test (locked down, next to Postgres)
        run: scripts/docker-smoke.sh family-calendar:ci

      - name: Production Compose stack smoke test (Caddy HTTPS + app + Postgres)
        run: scripts/compose-smoke.sh ci

      - name: Image size
        run: |
          docker image ls family-calendar:ci --format 'Image size: {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"

  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
