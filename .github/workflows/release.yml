# Releases.
#
# 1. On every push to main, release-please keeps a "chore(main): release X.Y.Z"
#    pull request up to date: the next version (from Conventional Commits:
#    feat → minor, fix → patch, feat! → major) and the CHANGELOG entries.
# 2. Merging that PR creates the tag vX.Y.Z and a GitHub Release.
# 3. Then the image is built, scanned and smoke-tested, and only if that passes
#    published to ghcr.io for linux/amd64 and linux/arm64, with an SBOM and a
#    signed build provenance attestation.
name: Release

on:
  push:
    branches: [main]

permissions: {} # each job asks for exactly what it needs

concurrency:
  group: release
  cancel-in-progress: false # never interrupt a publish halfway

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # tags, releases, CHANGELOG commits
      pull-requests: write # the release PR
      issues: write # labels on the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # PRs opened with the default GITHUB_TOKEN do not trigger other
          # workflows, so CI would not run on the release PR. With branch
          # protection requiring CI, add a fine-grained token as the
          # RELEASE_PLEASE_TOKEN secret (Contents + Pull requests: read/write).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # append the image reference to the release notes
      packages: write # push to ghcr.io
      id-token: write # Sigstore signing of the attestation
      attestations: write # store the attestation on GitHub
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
      MAJOR: ${{ needs.release-please.outputs.major }}
      MINOR: ${{ needs.release-please.outputs.minor }}
      TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Image name
        id: image
        # Registry paths must be lowercase (AndreyZubov → andreyzubov).
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # ---- Gate: the release candidate must pass the same checks as CI ----
      - name: Build release candidate (amd64, local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: family-calendar:release-candidate
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan for vulnerabilities (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            family-calendar:release-candidate

      - name: Smoke test
        run: scripts/docker-smoke.sh family-calendar:release-candidate

      # ---- Publish ----
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push (linux/amd64, linux/arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # 1.4.2 (exact, use this in deploy/.env) and 1.4 (latest patch).
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.VERSION }}
            ${{ steps.image.outputs.name }}:${{ env.MAJOR }}.${{ env.MINOR }}
          build-args: VERSION=${{ env.VERSION }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          # SBOM: every package in the image (generator pinned, like everything
          # else). Provenance: how, from what and by which workflow it was built.
          attests: |
            type=sbom,generator=docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          provenance: mode=max
          cache-from: type=gha

      - name: Attest build provenance (signed, verifiable with `gh attestation verify`)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Add the image to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            gh release view "$TAG" --json body --jq .body
            printf '\n## Docker image\n\n'
            printf '```\n%s:%s\n%s@%s\n```\n\n' "$IMAGE" "$VERSION" "$IMAGE" "$DIGEST"
            printf 'Platforms: linux/amd64, linux/arm64. Deploy: set `APP_VERSION=%s` in `deploy/.env`.\n\n' "$VERSION"
            printf 'Verify the build provenance:\n\n```\ngh attestation verify oci://%s:%s --repo %s\n```\n' "$IMAGE" "$VERSION" "$GITHUB_REPOSITORY"
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md
