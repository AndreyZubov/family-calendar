# Production stack. On the server, in this directory:
#
#   cp .env.example .env    # fill in the values
#   docker compose up -d
#
#   Internet ──80/443──▶ caddy ──[web]──▶ app:8080 ──[db, internal]──▶ postgres
#
# - Caddy terminates TLS (automatic Let's Encrypt certificates) and is the
#   only service with published ports.
# - Postgres sits on an internal network: no published port, no internet.
# - Every container runs with the minimum privileges it needs, memory limits
#   and rotated logs. Images are pinned by version and digest.
name: family-calendar

x-hardening: &hardening
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" } # at most 30 MB of logs per service

services:
  caddy:
    <<: *hardening
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    cap_add: [NET_BIND_SERVICE] # bind 80/443
    read_only: true
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates and ACME account: keep across restarts
      - caddy_config:/config
    tmpfs: [/tmp]
    networks:
      web:
        ipv4_address: 172.30.10.10 # the app trusts X-Forwarded-For from this address only
    depends_on:
      app: { condition: service_healthy }
    mem_limit: 64m
    pids_limit: 100

  app:
    <<: *hardening
    image: ${APP_IMAGE:-ghcr.io/andreyzubov/family-calendar}:${APP_VERSION:?set APP_VERSION in .env}
    read_only: true
    environment:
      APP_ENV: production
      APP_BASE_URL: https://${DOMAIN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://calendar:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/calendar?sslmode=disable
      DB_MAX_CONNS: "5"
      OIDC_ISSUER_URL: https://accounts.google.com
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID in .env}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      SESSION_TTL: ${SESSION_TTL:-720h}
      TRUSTED_PROXIES: 172.30.10.10/32
      SHUTDOWN_TIMEOUT: 15s
      # Go's garbage collector keeps the heap under this, well below mem_limit.
      GOMEMLIMIT: 48MiB
    # The image's HEALTHCHECK (/server healthcheck) applies.
    stop_grace_period: 20s # > SHUTDOWN_TIMEOUT, so in-flight requests finish
    networks:
      web: { ipv4_address: 172.30.10.20 } # egress: Google sign-in
      db: {}
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 64m
    pids_limit: 100

  postgres:
    <<: *hardening
    image: postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    # The entrypoint initializes the data directory and drops to the
    # "postgres" user, which needs these capabilities.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    read_only: true
    environment:
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: calendar
      # The image already requires scram-sha-256 passwords for all network
      # connections (the app). Only the Unix socket inside the container is
      # trusted — used by pg_dump/psql via `docker compose exec`.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=20
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=128MB
      - -c
      - log_min_duration_statement=200ms
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs: [/tmp, /var/run/postgresql]
    shm_size: 64m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar -d calendar"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks: [db]
    mem_limit: 256m
    pids_limit: 100
    stop_grace_period: 30s # let Postgres shut down cleanly

networks:
  web:
    ipam:
      config: [{ subnet: 172.30.10.0/24 }]
  db:
    internal: true # no route to the internet; only app and postgres

volumes:
  pgdata:
  caddy_data:
  caddy_config:
